name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    name: Typecheck + build + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node 26
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          cache: yarn

      # Node 25+ no longer bundles Corepack, which runs the Yarn version pinned
      # in package.json's packageManager field.
      - name: Enable Corepack
        run: npm install -g corepack@0.36.0 && corepack enable

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Typecheck
        run: yarn typecheck

      - name: Build production assets
        run: yarn build

      - name: Run unit tests
        run: yarn test:unit

  image:
    name: Docker image builds and serves
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build image
        run: docker build -t agentic-search-ui:ci .

      - name: Serve the SPA and render the nginx config
        run: |
          docker run -d --name web -p 8080:8080 -e BACKEND_URL=http://127.0.0.1:9 agentic-search-ui:ci
          for i in $(seq 1 20); do curl -fsS -o /dev/null http://127.0.0.1:8080/ && break; sleep 1; done
          curl -fsS http://127.0.0.1:8080/ | grep -q '<div id="root">'
          curl -fsS -H 'Accept: text/html' http://127.0.0.1:8080/chat | grep -q '<div id="root">'
          # No backend is running, so a proxied path must fail upstream (502), not serve HTML.
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/api/search-domains)" = 502

      - name: Logs on failure
        if: failure()
        run: docker logs web
